name: Build Heroic
on:
  workflow_dispatch:
  schedule:
    - cron: "00 22 * * *"
      timezone: "Asia/Beirut"

jobs:
  check-commit:
    runs-on: ubuntu-latest
    outputs:
      heroic_sha: ${{ steps.get-shas.outputs.heroic }}
      should_run: ${{ steps.get-shas.outputs.should_run }}
    steps:
      - name: Fetch Latest Commit SHAs
        id: get-shas
        run: |
          set -uo pipefail

          # Retry until we get a valid 40-char SHA
          FULL_SHA=""
          for i in $(seq 1 10); do
            FULL_SHA=$(git ls-remote https://github.com/Heroic-Games-Launcher/HeroicGamesLauncher.git refs/heads/main 2>/dev/null | cut -f1)
            if [[ "$FULL_SHA" =~ ^[0-9a-f]{40}$ ]]; then break; fi
            echo "Attempt $i: got '$FULL_SHA' (invalid/null), retrying in $((i*5))s..."
            FULL_SHA=""
            sleep $((i*5))
          done

          # Never continue with an invalid SHA (prevents "null" releases)
          if [ -z "$FULL_SHA" ]; then
            echo "::error::Could not determine upstream commit SHA after 10 attempts"
            exit 1
          fi
          HEROIC_SHA="${FULL_SHA:0:7}"
          echo "Upstream Heroic latest short commit: $HEROIC_SHA"

          # Does a release tag for this SHA already exist?
          TAGS=""
          for i in $(seq 1 5); do
            if TAGS=$(git ls-remote --tags "https://github.com/${{ github.repository }}.git" 2>/dev/null); then break; fi
            echo "Tag lookup attempt $i failed, retrying..."
            sleep $((i*3))
          done
          echo "heroic=$HEROIC_SHA" >> "$GITHUB_OUTPUT"

          if echo "$TAGS" | grep -q "refs/tags/${HEROIC_SHA}$"; then
            echo "Match found! Release $HEROIC_SHA already exists."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "New commits detected upstream or fresh repository environment."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build for ${{ matrix.os }} (${{ matrix.arch }})
    needs: check-commit
    if: needs.check-commit.outputs.should_run == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Linux Builds ---
          - os: ubuntu-latest
            platform: linux
            arch: x64
            command: pnpm dist:linux deb pacman tar.xz rpm AppImage --x64 --publish=never
          - os: ubuntu-latest
            platform: linux
            arch: arm64
            command: pnpm dist:linux deb pacman tar.xz rpm AppImage --arm64 --publish=never

          # --- Windows Builds ---
          - os: windows-latest
            platform: windows
            arch: x64
            command: pnpm dist:win --x64 --publish=never && pnpm dist:win portable --x64 --publish=never
          - os: windows-latest
            platform: windows
            arch: arm64
            command: pnpm dist:win --arm64 --publish=never && pnpm dist:win portable --arm64 --publish=never

          # --- macOS Builds ---
          - os: macos-latest
            platform: macos
            arch: universal
            command: pnpm dist:mac --x64 --arm64 --publish=never

    steps:
      - name: Install Linux Build Utilities
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y rpm libarchive-tools

      - name: Install pnpm
        uses: pnpm/action-setup@master
        with:
          standalone: ${{ matrix.platform == 'windows' }}
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@main
        with:
          node-version: latest

      - name: Clone Upstream Heroic Launcher
        run: git clone https://github.com/Heroic-Games-Launcher/HeroicGamesLauncher.git --recurse-submodules repo

      - name: Apply Pull Request Patch
        shell: bash
        run: |
          cd repo
          curl -sL https://github.com/Heroic-Games-Launcher/HeroicGamesLauncher/pull/5620/commits/c4a84df1053b203a38b2298d7b1311f3f73b0a4d.patch | git apply --3way

      - name: Install Dependencies & Setup Binaries
        shell: bash
        run: |
          cd repo
          pnpm add --global node-gyp
          pnpm install
          pnpm download-helper-binaries
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Compile Distribution Packages
        shell: bash
        run: |
          cd repo
          ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Binaries to Workflow Storage
        uses: actions/upload-artifact@main
        with:
          name: heroic-bins-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            repo/dist/Heroic-*-linux-*.deb
            repo/dist/Heroic-*-linux-*.rpm
            repo/dist/Heroic-*-linux-*.pacman
            repo/dist/Heroic-*-linux-*.tar.xz
            repo/dist/Heroic-*-linux-*.AppImage
            repo/dist/Heroic-*-macOS-*.dmg
            repo/dist/Heroic-*-macOS-*.zip
            repo/dist/Heroic-*-Setup-*.exe
            repo/dist/Heroic-*-Portable-*.exe
          retention-days: 1

  publish-release:
    name: Publish Cumulative Release
    needs: [check-commit, build]
    if: needs.check-commit.outputs.should_run == 'true' && needs.check-commit.outputs.heroic_sha != '' && needs.check-commit.outputs.heroic_sha != 'null'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download All Compiled Artifacts
        uses: actions/download-artifact@main
        with:
          path: all-artifacts

      - name: Stage Files for Release
        run: |
          mkdir release-ready
          find all-artifacts/ -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.pacman" -o -name "*.xz" -o -name "*.AppImage" -o -name "*.dmg" -o -name "*.zip" -o -name "*.exe" \) -exec cp {} release-ready/ \;
          echo "Files ready to upload:"
          ls -l release-ready/

      - name: Create Single GitHub Release
        uses: softprops/action-gh-release@master
        with:
          tag_name: ${{ needs.check-commit.outputs.heroic_sha }}
          name: Patched Heroic (${{ needs.check-commit.outputs.heroic_sha }})
          body: "Heroic + pr #5620."
          draft: false
          prerelease: false
          make_latest: true
          files: release-ready/*
