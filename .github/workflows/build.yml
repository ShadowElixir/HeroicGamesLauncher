name: Build Heroic
on:
  workflow_dispatch:
  schedule:
    - cron: "00 22 * * *"
      timezone: "Asia/Beirut"

jobs:
  check-commit:
    runs-on: ubuntu-latest
    outputs:
      heroic_sha: ${{ steps.get-shas.outputs.heroic }}
      should_run: ${{ steps.get-shas.outputs.should_run }}
    steps:
      - name: Fetch Latest Commit SHAs
        id: get-shas
        run: |
          set -uo pipefail

          # Retry until we get a valid 40-char SHA
          FULL_SHA=""
          for i in $(seq 1 10); do
            FULL_SHA=$(git ls-remote https://github.com/Heroic-Games-Launcher/HeroicGamesLauncher.git refs/heads/main 2>/dev/null | cut -f1)
            if [[ "$FULL_SHA" =~ ^[0-9a-f]{40}$ ]]; then break; fi
            echo "Attempt $i: got '$FULL_SHA' (invalid/null), retrying in $((i*5))s..."
            FULL_SHA=""
            sleep $((i*5))
          done

          # Never continue with an invalid SHA (prevents "null" releases)
          if [ -z "$FULL_SHA" ]; then
            echo "::error::Could not determine upstream commit SHA after 10 attempts"
            exit 1
          fi
          HEROIC_SHA="${FULL_SHA:0:7}"
          echo "Upstream Heroic latest short commit: $HEROIC_SHA"

          # Does a release tag for this SHA already exist?
          TAGS=""
          for i in $(seq 1 5); do
            if TAGS=$(git ls-remote --tags "https://github.com/${{ github.repository }}.git" 2>/dev/null); then break; fi
            echo "Tag lookup attempt $i failed, retrying..."
            sleep $((i*3))
          done
          echo "heroic=$HEROIC_SHA" >> "$GITHUB_OUTPUT"

          if echo "$TAGS" | grep -q "refs/tags/${HEROIC_SHA}$"; then
            echo "Match found! Release $HEROIC_SHA already exists."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "New commits detected upstream or fresh repository environment."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build for ${{ matrix.os }} (${{ matrix.arch }})
    needs: check-commit
    if: needs.check-commit.outputs.should_run == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Linux Builds ---
          - os: ubuntu-latest
            platform: linux
            arch: x64
            command: pnpm dist:linux deb pacman tar.xz rpm AppImage --x64 --publish=never
          - os: ubuntu-latest
            platform: linux
            arch: arm64
            command: pnpm dist:linux deb pacman tar.xz rpm AppImage --arm64 --publish=never

          # --- Windows Builds ---
          - os: windows-latest
            platform: windows
            arch: x64
            command: pnpm dist:win --x64 --publish=never && pnpm dist:win portable --x64 --publish=never
          - os: windows-latest
            platform: windows
            arch: arm64
            command: pnpm dist:win --arm64 --publish=never && pnpm dist:win portable --arm64 --publish=never

          # --- macOS Builds ---
          - os: macos-latest
            platform: macos
            arch: universal
            command: pnpm dist:mac --x64 --arm64 --publish=never

    steps:
      - name: Install Linux Build Utilities
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y rpm libarchive-tools

      - name: Install pnpm
        uses: pnpm/action-setup@master
        with:
          standalone: ${{ matrix.platform == 'windows' }}
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@main
        with:
          node-version: latest

      - name: Clone Upstream Heroic Launcher
        run: git clone https://github.com/Heroic-Games-Launcher/HeroicGamesLauncher.git --recurse-submodules repo

      - name: Apply PR 5620 Changes
        shell: bash
        run: |
          cd repo
          PY=$(command -v python3 || command -v python)
          # Anchored edits instead of `git apply`: upstream's ConsoleMode changes too fast for the raw patch.
          "$PY" - <<'PYEOF'
          import re, sys
          def edit(path, fn):
              s = open(path, encoding='utf-8').read()
              n = fn(s)
              if n == s:
                  sys.exit(f"::error::no change applied to {path}")
              open(path, 'w', encoding='utf-8').write(n)
          def sub1(pat, rep, s, flags=0):
              n, c = re.subn(pat, rep, s, count=1, flags=flags)
              if c != 1:
                  sys.exit(f"::error::anchor not found: {pat}")
              return n
          C = 'src/frontend/screens/ConsoleMode/'
          edit('public/locales/en/translation.json', lambda s: sub1(
              r'("hints": \{[^}]*?"sort": "Sort")(\s*\})',
              r'\1,\n            "toggle_installed": "Toggle Installed"\2', s, re.S))
          edit(C+'controller.ts', lambda s: sub1(
              r'(export const BTN_R2 = 7)', 'export const BTN_L2 = 6\n\\1', s))
          def scss(s):
              s = sub1(r'RB, RT,', 'RB, LT, RT,', s)
              s = s.replace('RB, RT,', 'RB, LT, RT,') if 'RB, RT,' in s else s
              s = s.replace('R1, R2,', 'R1, L2, R2,')
              return sub1(r'shoulder-r, trigger-r', 'shoulder-r, trigger-l, trigger-r', s)
          edit(C+'index.scss', scss)
          edit(C+'components/ControllerHints/index.tsx', lambda s: sub1(
              r'(      <div className="hint">\n        <i className="buttonImage trigger-r" />\n        \{t\(\'console\.hints\.sort\')',
              '      <div className="hint">\n        <i className="buttonImage trigger-l" />\n        {t(\'console.hints.toggle_installed\', \'Toggle Installed\')}\n      </div>\n\\1', s))
          def tsx(s):
              s = sub1(r'(  BTN_L1,\n)', r'\1  BTN_L2,\n', s)
              s = sub1(r'(setFilteringByInstalled\] = useState\()false\)', r'\1true)', s)
              s = sub1(r'(  useGamepadButtonPress\(BTN_R1, [^\n]*\n)',
                r'\1  const toggleInstalledGames = useCallback(\n    () => setFilteringByInstalled((v) => !v),\n    []\n  )\n  useGamepadButtonPress(BTN_L2, toggleInstalledGames, idle)\n', s)
              return s
          edit(C+'index.tsx', tsx)
          PYEOF
          if grep -rIlE '^(<<<<<<<|>>>>>>>) ' src public; then
            echo "::error::Conflict markers remain after patching"
            exit 1
          fi

      - name: Install Dependencies & Setup Binaries
        shell: bash
        run: |
          cd repo
          pnpm add --global node-gyp
          pnpm install
          pnpm download-helper-binaries
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Compile Distribution Packages
        shell: bash
        run: |
          cd repo
          ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Binaries to Workflow Storage
        uses: actions/upload-artifact@main
        with:
          name: heroic-bins-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            repo/dist/Heroic-*-linux-*.deb
            repo/dist/Heroic-*-linux-*.rpm
            repo/dist/Heroic-*-linux-*.pacman
            repo/dist/Heroic-*-linux-*.tar.xz
            repo/dist/Heroic-*-linux-*.AppImage
            repo/dist/Heroic-*-macOS-*.dmg
            repo/dist/Heroic-*-macOS-*.zip
            repo/dist/Heroic-*-Setup-*.exe
            repo/dist/Heroic-*-Portable-*.exe
          retention-days: 1

  publish-release:
    name: Publish Cumulative Release
    needs: [check-commit, build]
    if: needs.check-commit.outputs.should_run == 'true' && needs.check-commit.outputs.heroic_sha != '' && needs.check-commit.outputs.heroic_sha != 'null'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download All Compiled Artifacts
        uses: actions/download-artifact@main
        with:
          path: all-artifacts

      - name: Stage Files for Release
        run: |
          mkdir release-ready
          find all-artifacts/ -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.pacman" -o -name "*.xz" -o -name "*.AppImage" -o -name "*.dmg" -o -name "*.zip" -o -name "*.exe" \) -exec cp {} release-ready/ \;
          echo "Files ready to upload:"
          ls -l release-ready/

      - name: Create Single GitHub Release
        uses: softprops/action-gh-release@master
        with:
          tag_name: ${{ needs.check-commit.outputs.heroic_sha }}
          name: Patched Heroic (${{ needs.check-commit.outputs.heroic_sha }})
          body: "Heroic + pr #5620 changes."
          draft: false
          prerelease: false
          make_latest: true
          files: release-ready/*
